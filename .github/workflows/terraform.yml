name: Nexus DevOps Pipeline

on:
  push:
    branches:
      - main

jobs:

  packer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3

      - name: Packer Init
        run: packer init step3-packer/

      - name: Packer Build
        run: packer build step3-packer/nexus.pkr.hcl

  terraform:
    runs-on: ubuntu-latest
    needs: packer

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: step4-terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: step4-terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: step4-terraform
        run: terraform apply -auto-approve tfplan