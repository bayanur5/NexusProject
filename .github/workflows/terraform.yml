name: Build AMI and Deploy Terraform

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ami:
    runs-on: ubuntu-latest
    outputs:
      ami_id: ${{ steps.packer_build.outputs.ami_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Packer
        run: |
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update && sudo apt install -y packer

      - name: Packer Init
        working-directory: ./NexusProject/step3-packer
        run: packer init nexus.pkr.hcl

      - name: Packer Validate
        working-directory: ./NexusProject/step3-packer
        run: packer validate nexus.pkr.hcl

      - name: Packer Build
        id: packer_build
        working-directory: ./NexusProject/step3-packer
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          # Build AMI and capture AMI ID
          AMI_ID=$(packer build -machine-readable nexus.pkr.hcl | awk -F, '$0 ~/artifact,0,id/ {print $6}')
          echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
          echo "Built AMI: $AMI_ID"

  terraform:
    needs: build-ami
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Terraform Init & Apply
        working-directory: ./terraform-nexus-workflow
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AMI_ID: ${{ needs.build-ami.outputs.ami_id }}
        run: |
          terraform init
          terraform apply -auto-approve -var "ami_id=$AMI_ID"