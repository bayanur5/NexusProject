name: Build & Deploy Nexus

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      aws_region:
        description: 'AWS Region to deploy'
        required: false
        default: 'us-east-1'

env:
  # Use input from workflow_dispatch or default to us-east-1
  AWS_REGION: ${{ github.event.inputs.aws_region || 'us-east-1' }}

jobs:
  build-ami:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Packer
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          curl -fsSL https://releases.hashicorp.com/packer/1.9.4/packer_1.9.4_linux_amd64.zip -o packer.zip
          unzip packer.zip
          sudo mv packer /usr/local/bin/

      - name: Build Nexus AMI
        working-directory: NexusProject/packer
        run: |
          packer init .
          packer build -machine-readable nexus.pkr.hcl | tee packer.log

      - name: Extract AMI ID
        id: ami
        run: |
          AMI_ID=$(grep 'artifact,0,id' NexusProject/packer/packer.log | cut -d',' -f6 | cut -d':' -f2)
          echo "AMI_ID=$AMI_ID" >> $GITHUB_ENV

  deploy-nexus:
    needs: build-ami
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terraform
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          curl -fsSL https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip -o terraform.zip
          unzip terraform.zip
          sudo mv terraform /usr/local/bin/

      - name: Terraform Init
        working-directory: NexusProject/step5-module
        run: terraform init

      - name: Terraform Apply
        working-directory: NexusProject/step5-module
        run: terraform apply -auto-approve -var="ami_id=${{ env.AMI_ID }}" -var="region=${{ env.AWS_REGION }}"

      - name: Terraform Destroy (Optional)
        if: ${{ github.event.inputs.destroy == 'true' }}
        working-directory: NexusProject/step5-module
        run: terraform destroy -auto-approve -var="ami_id=${{ env.AMI_ID }}" -var="region=${{ env.AWS_REGION }}"