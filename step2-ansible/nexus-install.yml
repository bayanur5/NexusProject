---
- hosts: all
  become: true

  vars:
    nexus_version: "3.90.1-01"   # Change this to upgrade Nexus in future
    nexus_user: "nexus"
    nexus_install_dir: "/opt"
    nexus_tarball: "/tmp/nexus.tar.gz"
    nexus_url: "https://download.sonatype.com/nexus/3/nexus-{{ nexus_version }}-linux-x86_64.tar.gz"

  tasks:

    # --------------------------
    # 1. Update system
    # --------------------------
    - name: Update apt cache
      apt:
        update_cache: yes

    # --------------------------
    # 2. Install Java 11 (no recommends)
    # --------------------------
    - name: Install Java 11 (without recommends)
      apt:
        name: openjdk-11-jdk
        state: present
        install_recommends: no
        update_cache: yes

    # --------------------------
    # 3. Create Nexus user
    # --------------------------
    - name: Ensure nexus user exists
      user:
        name: "{{ nexus_user }}"
        state: present

    # --------------------------
    # 4. Download Nexus
    # --------------------------
    - name: Download Nexus tarball
      get_url:
        url: "{{ nexus_url }}"
        dest: "{{ nexus_tarball }}"

    # --------------------------
    # 5. Extract Nexus
    # --------------------------
    - name: Extract Nexus
      unarchive:
        src: "{{ nexus_tarball }}"
        dest: "{{ nexus_install_dir }}/"
        remote_src: yes

    # --------------------------
    # 6. Set permissions
    # --------------------------
    - name: Set Nexus ownership
      file:
        path: "{{ nexus_install_dir }}/nexus-{{ nexus_version }}"
        owner: "{{ nexus_user }}"
        group: "{{ nexus_user }}"
        recurse: yes

    # --------------------------
    # 7. Configure systemd service
    # --------------------------
    - name: Create systemd service for Nexus
      copy:
        dest: /etc/systemd/system/nexus.service
        content: |
          [Unit]
          Description=Nexus Repository Manager
          After=network.target
          [Service]
          Type=forking
          User={{ nexus_user }}
          ExecStart={{ nexus_install_dir }}/nexus-{{ nexus_version }}/bin/nexus start
          ExecStop={{ nexus_install_dir }}/nexus-{{ nexus_version }}/bin/nexus stop
          [Install]
          WantedBy=multi-user.target

    # --------------------------
    # 8. Enable and start Nexus service
    # --------------------------
    - name: Enable and start Nexus service
      systemd:
        name: nexus
        enabled: yes
        state: started